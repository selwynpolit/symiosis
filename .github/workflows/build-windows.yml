name: 'build-windows'

# Builds the Windows installers on demand and attaches them to the run as an
# artifact, so a branch can be tried on a Windows machine without installing a
# Rust toolchain there. Start it from the Actions tab: Run workflow.
on:
  workflow_dispatch:
  push:
    branches:
      - 'nv-fixes'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      # The suites run on Windows, which CI otherwise never does. Rust test
      # failures stop the build; frontend failures are reported only.
      - name: Frontend tests
        run: pnpm test
        continue-on-error: true

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build installers
        run: pnpm tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: symiosis-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
